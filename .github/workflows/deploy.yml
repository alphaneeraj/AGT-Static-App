name: Build & deploy to static.app

on:
  push:
    branches: [main]
  # Daily rebuild publishes scheduled posts and refreshes sitemap lastmod dates.
  schedule:
    - cron: '0 6 * * *'
  # "Rebuild & deploy now" button in /admin/
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      STATIC_APP_API_KEY: ${{ secrets.STATIC_APP_API_KEY }}
      STATIC_APP_PID: ${{ vars.STATIC_APP_PID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build site (pages, blog, sitemap, llms.txt, RSS)
        run: node scripts/build.mjs

      - name: Package admin portal for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-admin

      - name: Keep a downloadable copy of the build
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist
          retention-days: 14

      - name: Deploy to static.app
        if: ${{ env.STATIC_APP_API_KEY != '' && env.STATIC_APP_PID != '' }}
        # Own upload script: designmodo/static-app-deploy-action can't follow API redirects.
        run: bash scripts/deploy-static-app.sh

      - name: Deployment skipped
        if: ${{ env.STATIC_APP_API_KEY == '' || env.STATIC_APP_PID == '' }}
        run: |
          echo "::warning::Not deployed. Add repository secret STATIC_APP_API_KEY and repository variable STATIC_APP_PID (see README). The built site is attached to this run as 'site-dist'."

  # Admin portal on GitHub Pages (static.app's CSP blocks browser calls to api.github.com)
  admin-pages:
    needs: build-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}admin/
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
